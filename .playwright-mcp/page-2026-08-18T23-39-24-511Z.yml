    - heading "Legends of the table" [level=2] [ref=f1e38]
    - paragraph [ref=f1e39]:
      - strong [ref=f1e40]: Cain and Abel.
      - text: In July, KmikeyM founder Mike M. knocked his own brother out of the tournament. There is a standing one-share bounty for doing exactly that, and the brother now has five reasons of his own to survive the table.
    - paragraph [ref=f1e41]:
      - strong [ref=f1e42]: The 29,968-chip collapse.
      - text: Beau led July with a stack bigger than everyone else's combined, about two thirds of the chips in play, then bubbled. In August he cashed. The card economy remembers both.
