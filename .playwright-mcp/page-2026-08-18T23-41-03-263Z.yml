        - strong [ref=f2e54]: When.
        - text: Second Tuesday of the month, 7:00pm PT. Most nights run about three hours.
      - listitem [ref=f2e55]:
        - strong [ref=f2e56]: Where.
        - text: Cards on Poker Now, faces on the official Zoom. Both, not either.
      - listitem [ref=f2e57]:
        - strong [ref=f2e58]: Stakes.
        - text: $50 buy-in, up to two rebuys before the 8:05pm cutoff. Tournament format, everyone starts on the same stack.
      - listitem [ref=f2e59]:
        - strong [ref=f2e60]: Payouts.
        - text: A pool over $500 pays three places, otherwise it pays two.
      - listitem [ref=f2e61]:
        - strong [ref=f2e62]: The Zoom rule.
        - text: Players on the call may openly collude against players who are not. A dropped connection is forgiven. Sitting out the video all night is a choice, and the table is allowed to notice.
