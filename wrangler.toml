#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages config for poker.kmikeym.com.
# The site is static committed HTML served from site/ with NO build step;
# generation happens locally via tools/ (see docs/publishing.md).
name = "shareholder-poker"
compatibility_date = "2026-08-17"
pages_build_output_dir = "site"

# RSVP + roster rows (emails). Rows never enter git; see site/schema.sql.
[[d1_databases]]
binding = "POKER_RSVP_DB"
database_name = "poker-rsvp-db"
database_id = "34534627-37ad-4c09-a240-19d26afc9dad"

# Candidate card portraits, Tier 2b (portrait consent spec s3): PRIVATE bucket.
# Holds rendered candidate cards only (never source photos), one object per
# player per variant at asks/<set_slug>/<handle>/<variant>.png. Never public,
# never in git; every read goes through functions/api/portrait/.../img/.
[[r2_buckets]]
binding = "POKER_PORTRAITS"
bucket_name = "poker-portraits"
